<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gramin local database tables</title><style>:root{font:16px/1.5 system-ui;color:#193c32;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:28px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:28px}p{color:#60736a}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{font:inherit;border:1px solid #c8d6cc;background:white;color:#193c32;padding:10px 15px;border-radius:9px;cursor:pointer}button.active{background:#123d32;color:white}.panel{background:white;border:1px solid #dce5de;border-radius:14px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid #e2e8e3;max-width:420px;overflow-wrap:anywhere}th{position:sticky;top:0;background:#edf3ea}code{white-space:pre-wrap;font:13px/1.45 ui-monospace,monospace}.count{font-weight:700;color:#193c32}.warning{background:#fff0cb;padding:12px;border-radius:9px}@media(max-width:600px){main{padding:18px}h1{font-size:23px}}</style></head><body><main><header><div><h1>Gramin database tables</h1><p>Local developer view · read only · never deployed with the hosted app</p></div><a href="/progress.html">Launch progress</a></header><p class="warning">This page may contain private customer or staff data. Use it only on this computer.</p><nav id="tabs" aria-label="Database tables"></nav><p id="status" role="status">Loading local snapshot…</p><div class="panel"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;async function start(){try{const r=await fetch('/database.json',{cache:'no-store'});if(!r.ok)throw Error('Run node scripts/build-local-database-view.mjs to refresh the developer snapshot.');db=await r.json();const names=Object.keys(db.tables);tabs.innerHTML=names.map((n,i)=>'<button data-table="'+esc(n)+'" class="'+(i?'':'active')+'">'+esc(n)+' <span class="count">'+db.tables[n].length+'</span></button>').join('');tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));show(b.dataset.table)};show(names[0]);}catch(e){status.textContent=e.message}}function show(name){const rows=db.tables[name]||[],cols=[...new Set(rows.flatMap(Object.keys))];status.textContent=name+': '+rows.length+' record'+(rows.length===1?'':'s')+' · snapshot '+new Date(db.createdAt).toLocaleString();head.innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';body.innerHTML=rows.length?rows.map(row=>'<tr>'+cols.map(c=>{let v=row[c];try{if(typeof v==='string'&&/^[\[{]/.test(v))v=JSON.stringify(JSON.parse(v),null,2)}catch{}return '<td><code>'+esc(v??'—')+'</code></td>'}).join('')+'</tr>').join(''):'<tr><td colspan="'+Math.max(cols.length,1)+'">No records</td></tr>'}start();</script></body></html>
