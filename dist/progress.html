<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gramin launch tasks</title><style>body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f4f7f4;color:#183d32}main{max-width:800px;margin:auto;padding:28px 22px}header{display:flex;gap:14px;align-items:center}header img{width:58px;height:58px;object-fit:contain}h1{font-size:27px;margin:0}small{color:#60736a}#summary{padding:18px 0;font-weight:650}progress{width:100%;height:12px;accent-color:#1c5743;margin-bottom:20px}.task{display:flex;gap:15px;padding:19px;background:#fff;border:1px solid #dce5de;border-radius:12px;margin:10px 0}.mark{width:28px;height:28px;flex:0 0 28px;border:2px solid #cbd6ce;border-radius:50%;display:grid;place-items:center;margin-top:3px}.done .mark{background:#1c5743;color:#fff;border-color:#1c5743}.active{border-color:#557e42}.active .mark{border-color:#86a04b;color:#5b742e}.task strong{display:block}.task p{margin:4px 0;color:#60736a;font-size:14px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}.active .label{color:#5a702c}.done .label{color:#246144}.note{background:#e9eedc;padding:15px;border-radius:10px;font-size:14px}a{color:#1c5743}#error{color:#9b3825}</style></head><body><main><header><img src="/assets/gramin-logo.png" alt="Gramin"><div><h1>Gramin launch tasks</h1><small>Verified progress · updates automatically</small></div></header><div id="summary" role="status">Loading task status…</div><progress id="progress" max="12" value="0" aria-label="Completed tasks"></progress><div class="note">A checkmark means that step is complete. “In progress” means work is unfinished. Deployment is complete only when a live release is verified.</div><p id="error" role="alert"></p><section id="tasks"></section><p><small id="updated"></small></p><a href="/">Open the local prototype →</a></main><script>
let previous='';const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){try{const r=await fetch('/progress.json',{cache:'no-store'});if(!r.ok)throw Error();const raw=await r.text();document.querySelector('#error').textContent='';if(raw===previous)return;const data=JSON.parse(raw);previous=raw;const done=data.tasks.filter(t=>t.status==='done').length;document.querySelector('#summary').textContent=done+' of '+data.tasks.length+' steps complete';document.querySelector('#progress').max=data.tasks.length;document.querySelector('#progress').value=done;document.querySelector('#tasks').innerHTML=data.tasks.map(t=>'<article class="task '+escape(t.status)+'"><span class="mark" aria-label="'+(t.status==='done'?'Complete':t.status==='active'?'In progress':'Pending')+'">'+(t.status==='done'?'✓':t.status==='active'?'•':'')+'</span><div><span class="label">'+(t.status==='done'?'Complete':t.status==='active'?'In progress':'Next')+'</span><strong>'+escape(t.title)+'</strong><p>'+escape(t.detail)+'</p></div></article>').join('');document.querySelector('#updated').textContent='Latest update: '+data.updated;}catch{document.querySelector('#error').textContent='Status connection unavailable. Last displayed progress may be out of date.'}}refresh();setInterval(refresh,5000);
</script><p><a href="/database.html">Open local database tables →</a></p></body></html>
